<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCI Literatür Asistanı</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --accent-dark: #3f6ee0;
    --error: #ef5959;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main {
    width: 100%;
    max-width: 720px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    background: #0d0f13;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); }
  .row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    gap: 8px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .example-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 400;
  }
  .example-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--text); background: transparent; }
  #result {
    margin-top: 20px;
  }
  .answer-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .answer-card.error { border-color: var(--error); color: var(--error); }
  .sources {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
    color: var(--muted);
  }
  .sources-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    padding: 20px;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>🧠 BCI Literatür Asistanı</h1>
    <p>PubMed'den beyin-bilgisayar arayüzü (SSVEP, P300, BCI) makalelerini indeksleyen bir RAG sistemi.<br>Sorunu sor, koleksiyondaki makalelerden kaynak göstererek cevap alsın.</p>
  </header>

  <div class="card">
    <textarea id="question" placeholder="Örn: SSVEP nedir?"></textarea>
    <div class="row">
      <button id="ask-btn">Sor</button>
    </div>
    <div class="examples">
      <button class="example-chip" data-q="SSVEP nedir?">SSVEP nedir?</button>
      <button class="example-chip" data-q="P300 speller nasıl çalışır?">P300 speller nasıl çalışır?</button>
      <button class="example-chip" data-q="BCI kalibrasyonu neden zor?">BCI kalibrasyonu neden zor?</button>
    </div>
  </div>

  <div id="result"></div>

  <footer>
    API dokümantasyonu: <a href="/docs">/docs</a> ·
    <a href="https://github.com/BayramGurbuz/rag-literature-assistant" target="_blank" rel="noopener">GitHub</a>
  </footer>
</main>

<script>
  const questionEl = document.getElementById("question");
  const askBtn = document.getElementById("ask-btn");
  const resultEl = document.getElementById("result");

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // Basit bir markdown->HTML dönüşümü: **kalın** ve satır başındaki "- " madde işaretleri.
  // Kaynaklar bölümünü ayrı bir blokta gösteriyoruz.
  function renderAnswer(text) {
    const [body, ...rest] = text.split(/\n\nKaynaklar:\n/);
    const sourcesRaw = rest.join("\n\nKaynaklar:\n");

    const toHtml = (s) =>
      escapeHtml(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[-*] (.+)$/gm, "• $1");

    let html = `<div class="answer-card">${toHtml(body)}</div>`;
    if (sourcesRaw.trim()) {
      html += `<div class="answer-card sources">
        <div class="sources-label">Kaynaklar</div>
        ${toHtml(sourcesRaw.trim())}
      </div>`;
    }
    return html;
  }

  async function ask(question) {
    if (!question.trim()) return;
    askBtn.disabled = true;
    resultEl.innerHTML = `<div class="loading"><div class="spinner"></div> Cevap hazırlanıyor (ilk istekte sunucu uyanıyor olabilir, biraz sürebilir)…</div>`;

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await response.json();

      if (!response.ok) {
        const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
        resultEl.innerHTML = `<div class="answer-card error">Hata (${response.status}): ${escapeHtml(detail)}</div>`;
        return;
      }
      resultEl.innerHTML = renderAnswer(data.answer);
    } catch (err) {
      resultEl.innerHTML = `<div class="answer-card error">İstek başarısız oldu: ${escapeHtml(String(err))}</div>`;
    } finally {
      askBtn.disabled = false;
    }
  }

  askBtn.addEventListener("click", () => ask(questionEl.value));
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(questionEl.value);
  });
  document.querySelectorAll(".example-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      questionEl.value = chip.dataset.q;
      ask(chip.dataset.q);
    });
  });
</script>
</body>
</html>
